<label style="margin-right:250px;">
									        <b>30/03/2012 - </b>
									        <a href="javascript:return(false);" onclick="window.open('textoEmentas.asp?idEmenta=725','popementa725' ,'scrollbars=yes,status=yes,maximize=no,menubar=no,toolbar=yes,location=no,directories=no,resizable=yes,width=800,height=600,left=0,top=0');">As Notificações deixaram de transcrever com clareza, os dados dos autos que deveriam ser devolvidos. “É indispensável, sob pena de nulidade, que da publicação constem os nomes das partes e de seus advogados, suficientes para sua identificação” cf. § 1<sup><u>o</u></sup> do artigo 236 do CPC. A Certidão do Diretor de Secretaria possui fé publica. É dever, porem, do serventuário de lavrar certidão com clareza e precisão acerca dos atos praticados no processo, para que a parte tenha pleno conhecimento. Os documentos juntados trazem informações diversas e deixam fundadas duvidas quanto à eficácia da intimação levada ao representado, através da imprensa. Predomina o entendimento de que, para caracterizar a violação é necessário que a retenção seja de forma abusiva, visando alguma finalidade em seu proveito. Torna-se indispensável a prova de que o querelado, deliberadamente, tenha retido os autos, com o objetivo de causar prejuízos à parte contrária, notadamente num processo de 13 anos sem solução. Não há qualquer reclamação por parte do MM. Juiz quanto à obstrução da atividade jurisdicional do Estado. O inciso XXII do artigo 34 do Estatuto refere-se a retenção abusiva de autos e a pena prevista é de suspensão.. O voto é pelo arquivamento do processo disciplinar, com absolvição.</a>
